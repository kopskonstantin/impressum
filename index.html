<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta http-equiv="refresh" content="0; url=impressum.html" />
	<title>Impressum</title>
	<style>
:root {
	--bg: #0b0820;
	--panel: #140f3a;
	--text: #eeeaff;
	--muted: #b7a6ff;
	--accent: #ffd23f;
	--line: rgba(183, 166, 255, 0.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; font-size: 17px; }
main { max-width: 760px; margin: 0 auto; padding: 48px 16px 80px; }
h1 { font-size: 34px; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 22px; margin: 36px 0 8px; color: var(--accent); }
h3 { font-size: 18px; margin: 24px 0 4px; }
p, address { margin: 0 0 12px; font-style: normal; }
a { color: var(--accent); }
.brand { font-weight: 800; letter-spacing: -0.5px; margin-bottom: 28px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px 24px; margin: 16px 0; }
.muted { color: var(--muted); font-size: 15px; }
nav { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 32px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
</style>
</head>
<body>
<main><p><a href="impressum.html">Impressum / Legal notice</a> · <a href="datenschutz.html">Datenschutz / Privacy</a></p></main>
</body>
</html>
